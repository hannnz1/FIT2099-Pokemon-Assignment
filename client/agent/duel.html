<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练师对战 · Pokémon</title><link rel="stylesheet" href="/duel/duel.css"><link rel="stylesheet" href="/ui/player-frame.css"><script type="module" src="/ui/player-navigation.mjs"></script></head><body data-player-page="duel">
<header><div><small>POKÉMON · V5</small><h1>训练师对战</h1></div><nav><a href="/growth/">伙伴冒险</a><a href="/quest/">AI 委托</a><a href="/evaluation/">评测中心</a></nav></header>
<main><div class="controls"><p id="connection" role="status">正在连接…</p><button id="reconnect">重新连接</button><button id="retry-request" hidden>重试未确认操作</button></div><p id="notice" role="alert"></p><div id="battle-outcome" class="battle-outcome" hidden><strong id="outcome-title"></strong><button id="battle-again">再次挑战</button><button id="battle-adjust">调整队伍</button><a href="/growth/">返回伙伴冒险</a></div><section class="setup"><h2>准备队伍</h2><p id="setup-description">最多选择 3 位伙伴。不选择时使用 Lv.20 示范队伍。对战副本自动恢复 HP / PP，不影响冒险进度。</p><div id="team-options"></div><div class="fields"><label>对战难度<select id="difficulty"><option value="standard">标准对战</option><option value="rookie">见习训练师 · 1 对 1</option></select></label><details id="battle-advanced"><summary>对战策略与高级设置</summary><div class="fields"><label>玩法<select id="mode"><option value="manual">玩家对 AI</option><option value="delegated">委托 AI 操作己方</option><option value="auto">AI 对 AI</option></select></label><label>己方策略<select id="left-model"></select></label><label>对手策略<select id="right-model"></select></label><label>固定 Seed<input id="seed" type="number" min="1" max="1000000" value="11"></label></div></details></div><div class="battle-preview"><span aria-hidden="true">⚑</span><p><strong id="battle-preview-label">标准训练师 · 队伍挑战</strong><br>对战中可暂停并手动接管。</p><div id="battle-preview-roster" aria-label="对手队伍预览"></div></div><button id="start">开始对战</button><span id="start-note"></span></section>
<section class="arena" id="battle-arena" hidden><div id="opponent"></div><div class="stage"><img id="opponent-art" alt="对手伙伴"><img id="partner-art" alt="己方伙伴"><p id="battle-status" role="status">准备开始</p></div><div id="partner"></div></section><p id="battle-feedback" class="battle-feedback" role="status" aria-live="polite"></p>
<section class="battle-controls" id="battle-controls" hidden><h2>选择行动</h2><p id="hint"></p><div id="actions"></div><div class="controls"><button id="pause">暂停</button><button id="resume">继续 AI</button><button id="manual">接管己方</button><button id="cancel">结束本局</button><button id="recover">恢复存档</button><button id="download">下载回放</button></div></section>
<section><details><summary>回合回放与模型用量</summary><label>查看回合<input id="replay" type="range" min="0" max="0" value="0"></label><div id="replay-detail"></div><details><summary>模型与用量</summary><p id="usage"></p><div id="decisions"></div></details></details></section>
</main><script type="module" src="/duel/duel.mjs"></script></body></html>
