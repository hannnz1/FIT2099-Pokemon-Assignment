name: Web demo verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.18.0', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: npm ci --prefix web-client
      - run: node tools/export-map.mjs
      - run: npm test --prefix web-client && npm run lint --prefix web-client && npm run build --prefix web-client
      - run: mvn -B clean verify
      - run: npx --prefix web-client playwright install --with-deps chrome
      - run: |
          java -jar target/fit2099-pokemon-assignment-1.0.0.jar > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break || sleep 1; done
          cd web-client && npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: 'web-client/test-results'}
